  <!-- Live reload: poll Last-Modified, reload when file changes (only when served via http://) -->
  <script>
    (function () {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      let last = null;
      setInterval(async () => {
        try {
          const r = await fetch(location.pathname + '?_=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
          const m = r.headers.get('last-modified');
          if (!m) return;
          if (last && m !== last) location.reload();
          last = m;
        } catch (_) {}
      }, 1200);
    })();
  </script>

      const w = Number(weight); const r = Number(reps);
      if (!w || !r) return 0;
      if (r === 1) return w;
      return Math.round(w * (1 + r / 30));
    }

    // Default rest seconds when the program doesn't specify one
    const DEFAULT_REST_SECONDS = 90;

    // Parse "4 × 8-10" / "5 × 3 @ 85%" → number of sets recommended
    function parseSetCount(detail) {
      const m = /^(\d+)\s*[×x]/i.exec(detail || '');
      if (m) {
        const n = parseInt(m[1], 10);
        return Math.min(Math.max(n, 1), 10);
      }
      return 3;
    }

    function validatePassword(pw) {
      if (!pw || pw.length < 8) return 'Password must be at least 8 characters.';
      if (!/[A-Z]/.test(pw))    return 'Password must include an uppercase letter.';
      if (!/[a-z]/.test(pw))    return 'Password must include a lowercase letter.';
      if (!/[^A-Za-z0-9]/.test(pw)) return 'Password must include a special character.';
      return null;
    }

    // Basic profanity filter — substring match, case insensitive.
    // Not exhaustive; expand as needed.
    const PROFANITY = [
      'fuck', 'shit', 'bitch', 'cunt', 'nigger', 'nigga', 'faggot', 'retard',
      'cock', 'dick', 'pussy', 'whore', 'slut', 'asshole', 'twat', 'dildo',
      'penis', 'vagina', 'wank', 'jerkoff', 'jizz', 'cum',
    ];
    function containsProfanity(s) {
      const lower = (s || '').toLowerCase();
      return PROFANITY.some((w) => lower.includes(w));
    }

    // Username rules: < 25 chars, no whitespace, no profanity. Letters, numbers,
    // underscores, hyphens, and other symbols are all allowed.
    function validateUsername(name) {
      const u = (name || '').trim();
      if (!u)                  return 'Username is required.';
      if (u.length >= 25)      return 'Username must be less than 25 characters.';
      if (/\s/.test(u))        return 'Username cannot contain spaces.';
      if (containsProfanity(u)) return 'That username contains a word we don\'t allow.';
      return null;
    }

    const USERNAME_CHANGE_LIMIT = 3;
    const USERNAME_CHANGE_COOLDOWN_DAYS = 30;

    function validateBodyMetrics({ heightFt, heightIn, weightLbs }) {
      const ft = Number(heightFt);
      const inch = Number(heightIn);
      const w = Number(weightLbs);
      if (!Number.isFinite(ft) || ft < 3 || ft > 8)
        return 'Enter a valid height in feet (3–8).';
      if (!Number.isFinite(inch) || inch < 0 || inch >= 12)
        return 'Inches must be between 0 and 11.';
      if (!Number.isFinite(w) || w < 50 || w > 800)
        return 'Enter a valid weight in pounds (50–800).';
      return null;
    }

    const GENDER_OPTIONS = [
      { id: 'male',               label: 'Male' },
      { id: 'female',             label: 'Female' },
      { id: 'prefer_not_to_say',  label: 'Prefer not to say' },
    ];

    function validateGender(g) {
      if (!g) return 'Please select a gender.';
      if (!GENDER_OPTIONS.some((o) => o.id === g)) return 'Select a valid gender option.';
      return null;
    }

    function genderLabel(id) {
      return GENDER_OPTIONS.find((o) => o.id === id)?.label || '—';
    }

    function validateDateOfBirth(dob) {
      if (!dob) return 'Date of birth is required.';
      const d = new Date(dob);
      if (isNaN(d.getTime())) return 'Enter a valid date of birth.';
      const now = new Date();
      if (d > now) return 'Date of birth cannot be in the future.';
      const age = (now - d) / (1000 * 60 * 60 * 24 * 365.25);
      if (age < 13)  return 'You must be at least 13 to create an account.';
      if (age > 120) return 'Enter a valid date of birth.';
      return null;
    }

    const AUTH = {
      _readUsers()  { try { return JSON.parse(localStorage.getItem('trnsfrm:users') || '{}'); } catch { return {}; } },
      _writeUsers(u) { localStorage.setItem('trnsfrm:users', JSON.stringify(u)); },
      currentEmail() { return localStorage.getItem('trnsfrm:session'); },

      signup({ firstName, lastName, username, email, password, agreeTos, agreePromo, profilePicture, heightFt, heightIn, weightLbs, dateOfBirth, gender }) {
        const fn = (firstName || '').trim();
        const ln = (lastName  || '').trim();
        const u  = (username  || '').trim();
        const e  = (email     || '').trim().toLowerCase();
        if (!fn || !ln) return { error: 'First and last name are required.' };
        const uErr = validateUsername(u);
        if (uErr)       return { error: uErr };
        if (!e)         return { error: 'Email is required.' };
        if (!/^\S+@\S+\.\S+$/.test(e)) return { error: 'Enter a valid email.' };
        const pwErr = validatePassword(password);
        if (pwErr)      return { error: pwErr };
        const bodyErr = validateBodyMetrics({ heightFt, heightIn, weightLbs });
        if (bodyErr)    return { error: bodyErr };
        const dobErr = validateDateOfBirth(dateOfBirth);
        if (dobErr)     return { error: dobErr };
        const genErr = validateGender(gender);
        if (genErr)     return { error: genErr };
        if (!agreeTos)  return { error: 'You must agree to the Terms and Conditions.' };
        const users = this._readUsers();
        if (users[e])   return { error: 'An account with that email already exists.' };
        if (this.usernameTaken(u)) return { error: 'That username is already taken.' };
        users[e] = {
          firstName: fn,
          lastName:  ln,
          username:  u,
          password,
          profilePicture: profilePicture || null,
          heightFt:  Number(heightFt),
          heightIn:  Number(heightIn),
          weightLbs: Number(weightLbs),
          dateOfBirth,
          gender,
          agreePromo: !!agreePromo,
          agreeTos:   true,
          tosAcceptedAt: Date.now(),
          usernameChangeCount: 0,
          usernameLastChangedAt: null,
          results: null,
          createdAt: Date.now(),
        };
        this._writeUsers(users);
        localStorage.setItem('trnsfrm:session', e);
        return { email: e };
      },

      // One-time DOB set: only allowed if not previously stored.
      setDateOfBirthOnce(email, dob) {
        const e = (email || '').trim().toLowerCase();
        const users = this._readUsers();
        if (!users[e]) return { error: 'No user found.' };
        if (users[e].dateOfBirth) return { error: 'Date of birth has already been set and can\'t be changed.' };
        const valErr = validateDateOfBirth(dob);
        if (valErr) return { error: valErr };
        users[e].dateOfBirth = dob;
        this._writeUsers(users);
        return { ok: true };
      },

      // One-shot correction: allowed exactly once after the initial DOB set.
      correctDateOfBirth(email, dob) {
        const e = (email || '').trim().toLowerCase();
        const users = this._readUsers();
        if (!users[e]) return { error: 'No user found.' };
        if (!users[e].dateOfBirth) return { error: 'No date of birth on file yet.' };
        if (users[e].dobCorrected) return { error: 'You\'ve already used your one-time DOB correction.' };
        const valErr = validateDateOfBirth(dob);
        if (valErr) return { error: valErr };
        users[e].dateOfBirth = dob;
        users[e].dobCorrected = true;
        this._writeUsers(users);
        return { ok: true };
      },

      updateBodyMetrics(email, { heightFt, heightIn, weightLbs }) {
        const e = (email || '').trim().toLowerCase();
        const valErr = validateBodyMetrics({ heightFt, heightIn, weightLbs });
        if (valErr) return { error: valErr };
        const users = this._readUsers();
        if (!users[e]) return { error: 'No user found.' };
        users[e].heightFt  = Number(heightFt);
        users[e].heightIn  = Number(heightIn);
        users[e].weightLbs = Number(weightLbs);
        this._writeUsers(users);
        return { ok: true };
      },

      getUser(email) {
        const e = (email || '').trim().toLowerCase();
        return this._readUsers()[e] || null;
      },

      // Returns { canChange, reason, daysUntilNextChange, changesUsed, changesRemaining }
      usernameChangeStatus(email) {
        const u = this.getUser(email);
        if (!u) return { canChange: false, reason: 'No user found.', changesUsed: 0, changesRemaining: 0 };
        const used = u.usernameChangeCount || 0;
        const remaining = Math.max(0, USERNAME_CHANGE_LIMIT - used);
        if (remaining <= 0) {
          return { canChange: false, reason: 'You\'ve used all 3 username changes for this account.', changesUsed: used, changesRemaining: 0 };
        }
        if (u.usernameLastChangedAt) {
          const elapsed = (Date.now() - u.usernameLastChangedAt) / (1000 * 60 * 60 * 24);
          const cooldown = USERNAME_CHANGE_COOLDOWN_DAYS - elapsed;
          if (cooldown > 0) {
            const days = Math.ceil(cooldown);
            const nextDate = new Date(u.usernameLastChangedAt + USERNAME_CHANGE_COOLDOWN_DAYS * 86400000);
            return {
              canChange: false,
              reason: `You can change your username again in ${days} day${days === 1 ? '' : 's'}.`,
              nextDate,
              daysUntilNextChange: days,
              changesUsed: used,
              changesRemaining: remaining,
            };
          }
        }
        return { canChange: true, changesUsed: used, changesRemaining: remaining };
      },

      usernameTaken(username, exceptEmail = null) {
        const target = (username || '').trim().toLowerCase();
        const users = this._readUsers();
        for (const [email, user] of Object.entries(users)) {
          if (exceptEmail && email === exceptEmail) continue;
          if ((user.username || '').toLowerCase() === target) return true;
        }
        return false;
      },

      changeUsername(email, newUsername) {
        const e = (email || '').trim().toLowerCase();
        const u = (newUsername || '').trim();
        const users = this._readUsers();
        const user = users[e];
        if (!user) return { error: 'No user found.' };
        const status = this.usernameChangeStatus(e);
        if (!status.canChange) return { error: status.reason };
        const valErr = validateUsername(u);
        if (valErr) return { error: valErr };
        if (u.toLowerCase() === (user.username || '').toLowerCase()) {
          return { error: 'That\'s already your username.' };
        }
        if (this.usernameTaken(u, e)) return { error: 'That username is already taken.' };
        user.username = u;
        user.usernameChangeCount = (user.usernameChangeCount || 0) + 1;
        user.usernameLastChangedAt = Date.now();
        this._writeUsers(users);
        return { username: u };
      },

      updateProfilePicture(email, dataUrl) {
        const e = (email || '').trim().toLowerCase();
        const users = this._readUsers();
        if (!users[e]) return { error: 'No user found.' };
        users[e].profilePicture = dataUrl || null;
        this._writeUsers(users);
        return { ok: true };
      },

      // ─── Custom workouts & programs (Creation Zone) ─────────────
      addCustomWorkout(email, workout) {
        const e = (email || '').trim().toLowerCase();
        const users = this._readUsers();
        if (!users[e]) return { error: 'No user found.' };
        users[e].customWorkouts = users[e].customWorkouts || [];
        const id = `custom-w-${Date.now()}`;
        const item = { ...workout, id, isCustom: true, createdAt: Date.now() };
        users[e].customWorkouts.push(item);
        this._writeUsers(users);
        return { item };
      },

      addCustomProgram(email, program) {
        const e = (email || '').trim().toLowerCase();
        const users = this._readUsers();
        if (!users[e]) return { error: 'No user found.' };
        users[e].customPrograms = users[e].customPrograms || { hypertrophy: [], powerlifting: [] };
        const cat = program.category === 'powerlifting' ? 'powerlifting' : 'hypertrophy';
        const id = `custom-p-${Date.now()}`;
        const item = { ...program, id, isCustom: true, createdAt: Date.now() };
        users[e].customPrograms[cat] = users[e].customPrograms[cat] || [];
        users[e].customPrograms[cat].push(item);
        this._writeUsers(users);
        return { item, category: cat };
      },

      getCustomWorkouts(email) {
        const u = this.getUser(email);
        return u?.customWorkouts || [];
      },

      getCustomPrograms(email, category = null) {
        const u = this.getUser(email);
        const all = u?.customPrograms || { hypertrophy: [], powerlifting: [] };
        if (category) return all[category] || [];
        return all;
      },

      // ─── Workout tracking, history & PRs ───────────────────────
      saveWorkoutSession(email, session) {
        const e = (email || '').trim().toLowerCase();
        const users = this._readUsers();
        if (!users[e]) return { error: 'No user found.' };
        users[e].workoutHistory = users[e].workoutHistory || [];
        users[e].prs = users[e].prs || {};

        // Detect new PRs by comparing best e1RM in this session against stored PR
        const newPRs = [];
        for (const ex of (session.exercises || [])) {
          let bestSet = null;
          let bestE1RM = 0;
          for (const s of (ex.sets || [])) {
            const e1rm = estimate1RM(s.weight, s.reps);
            if (e1rm > bestE1RM) { bestE1RM = e1rm; bestSet = s; }
          }
          if (!bestSet) continue;
          const prior = users[e].prs[ex.name];
          const priorE1RM = prior ? estimate1RM(prior.weight, prior.reps) : 0;
          if (bestE1RM > priorE1RM) {
            users[e].prs[ex.name] = {
              weight: Number(bestSet.weight),
              reps:   Number(bestSet.reps),
              e1RM:   bestE1RM,
              previousE1RM: priorE1RM,
              achievedAt:   Date.now(),
            };
            newPRs.push({
              exercise: ex.name,
              weight:   Number(bestSet.weight),
              reps:     Number(bestSet.reps),
              e1RM:     bestE1RM,
              previousE1RM: priorE1RM,
            });
          }
        }

        const stored = {
          id: session.id || `session-${Date.now()}`,
          itemId:    session.itemId    || null,
          itemName:  session.itemName  || 'Workout',
          itemType:  session.itemType  || 'workout',
          startedAt: session.startedAt || Date.now(),
          completedAt: Date.now(),
          exercises: (session.exercises || []).map((ex) => ({
            name: ex.name,
            sets: (ex.sets || []).map((s) => ({
              weight: Number(s.weight),
              reps:   Number(s.reps),
              restSeconds: s.restSeconds != null ? Number(s.restSeconds) : null,
            })),
          })),
        };
        users[e].workoutHistory.push(stored);
        this._writeUsers(users);
        return { ok: true, session: stored, newPRs };
      },

      getWorkoutHistory(email) {
        return this.getUser(email)?.workoutHistory || [];
      },

      getPRs(email) {
        return this.getUser(email)?.prs || {};
      },

      deleteCustomItem(email, id) {
        const e = (email || '').trim().toLowerCase();
        const users = this._readUsers();
        if (!users[e]) return { error: 'No user found.' };
        if (users[e].customWorkouts) {
          users[e].customWorkouts = users[e].customWorkouts.filter((w) => w.id !== id);
        }
        if (users[e].customPrograms) {
          for (const cat of Object.keys(users[e].customPrograms)) {
            users[e].customPrograms[cat] = users[e].customPrograms[cat].filter((p) => p.id !== id);
          }
        }
        this._writeUsers(users);
        return { ok: true };
      },

      login(email, password) {
        const e = (email || '').trim().toLowerCase();
        const users = this._readUsers();
        const user = users[e];
        if (!user || user.password !== password) return { error: 'Invalid email or password.' };
        localStorage.setItem('trnsfrm:session', e);
        return { email: e, results: user.results };
      },

      logout() { localStorage.removeItem('trnsfrm:session'); },

      saveResults(email, results) {
        const users = this._readUsers();
        if (!users[email]) return;
        users[email].results = { ...results, savedAt: Date.now() };
        this._writeUsers(users);
      },

      getResults(email) {
        const users = this._readUsers();
        return users[email]?.results || null;
      },
    };

    // ─────────────────────────────────────────────────────────────
    // SCORING LOGIC
    // ─────────────────────────────────────────────────────────────

    function calculateResults(answers) {
      const totals = { Builder: 0, Endurer: 0, Hybrid: 0, Competitor: 0 };

      answers.forEach(({ scores }) => {
        Object.entries(scores).forEach(([lane, pts]) => {
          totals[lane] += pts;
        });
      });

      const ranked = Object.entries(totals)
        .sort(([, a], [, b]) => b - a)
        .map(([lane]) => lane);

      return { primary: ranked[0], secondary: ranked[1], totals };
    }

    // Resize uploaded image to a max dimension and JPEG-encode as data URL,
    // so localStorage doesn't blow up on a multi-MB photo.
    function resizeImageDataURL(file, max = 256) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const ratio = Math.min(max / img.width, max / img.height, 1);
            const w = Math.round(img.width * ratio);
            const h = Math.round(img.height * ratio);
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

                    <span className="text-xs text-white/40 shrink-0" style={{ letterSpacing: '0.05em' }}>in</span>
                  </div>
                </div>
              </div>

              <div>
                <div className="flex items-center mb-2">
                  <label className="text-xs text-white/40 font-medium" style={fieldLabel}>
                    WEIGHT
                  </label>
                  <HelpHint>
                    Used to personalize your fitness program. Never shared outside your account.
                  </HelpHint>
                </div>
                <div className="flex items-baseline gap-2">
                  <input
                    type="number" inputMode="decimal" min="50" max="800" step="0.1" required
                    value={weightLbs} onChange={(e) => setWeightLbs(e.target.value)}
                    style={inputStyle}
                    onFocus={(ev) => ev.target.style.borderBottom = focusBorder}
                    onBlur={(ev)  => ev.target.style.borderBottom = blurBorder}
                  />
                  <span className="text-xs text-white/40 shrink-0" style={{ letterSpacing: '0.05em' }}>lbs</span>
                </div>
              </div>

              <div>
                <label className="text-xs text-white/40 font-medium block mb-2" style={fieldLabel}>
                  DATE OF BIRTH
                </label>
                <input
                  type="date" required
                  value={dateOfBirth} onChange={(e) => setDateOfBirth(e.target.value)}
                  max={new Date().toISOString().split('T')[0]}
                  style={{ ...inputStyle, colorScheme: 'dark' }}
                  onFocus={(ev) => ev.target.style.borderBottom = focusBorder}
                  onBlur={(ev)  => ev.target.style.borderBottom = blurBorder}
                />
              </div>

              {/* Gender */}
              <div>
                <div className="flex items-center mb-3">
                  <label className="text-xs text-white/40 font-medium" style={fieldLabel}>
                    GENDER
                  </label>
                  <HelpHint>
                    Used only to personalize your training experience. Never shown publicly or shared outside your profile.
                  </HelpHint>
                </div>
                <div className="flex flex-col gap-2">
                  {GENDER_OPTIONS.map((opt) => {
                    const active = gender === opt.id;
                    return (
                      <button
                        key={opt.id}
                        type="button"
                        onClick={() => setGender(opt.id)}
                        className={`answer-card text-left text-sm font-medium px-4 py-3 border transition-colors
                          ${active
                            ? 'bg-white text-black border-white'
                            : 'bg-transparent text-white/70 hover:text-white'
                          }`}
                        style={!active ? { borderColor: 'rgba(255,255,255,0.15)' } : {}}
                      >
                        {opt.label}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Checkboxes */}
              <div className="flex flex-col gap-3 pt-2">
                <label className="flex items-start gap-3 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={agreeTos}
                    onChange={(e) => setAgreeTos(e.target.checked)}
                    style={{ accentColor: '#fff', marginTop: '3px', width: 16, height: 16 }}
                  />
                  <span className="text-xs text-white/70 leading-relaxed">
                    I agree to the <span className="text-white underline">Terms and Conditions</span> <span className="text-white/30">(coming soon)</span>.
                  </span>
                </label>
                <label className="flex items-start gap-3 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={agreePromo}
                    onChange={(e) => setAgreePromo(e.target.checked)}
                    style={{ accentColor: '#fff', marginTop: '3px', width: 16, height: 16 }}
                  />
                  <span className="text-xs text-white/70 leading-relaxed">
                    Send me promotional emails from TRNSFRM.
                  </span>
                </label>
              </div>

              {(localError || error) && (
                <p className="text-xs text-red-400 font-medium" style={{ letterSpacing: '0.04em' }}>
                  {localError || error}
                </p>
              )}

              <button
                type="submit"
                className="w-full bg-white text-black font-semibold text-xs py-4 px-6 hover:bg-white/90 active:bg-white/80 transition-colors mt-2"
                style={fieldLabel}
              >
                CREATE ACCOUNT
              </button>
            </form>
          </div>

          <div className="pt-6 flex flex-col gap-2 items-center">
            <button
              onClick={onSwitch}
              className="text-xs text-white/50 font-medium hover:text-white/80 transition-colors py-2"
              style={fieldLabel}
            >
              HAVE AN ACCOUNT? <span className="text-white">LOG IN</span>
            </button>
            <button
              onClick={onBack}
              className="text-xs text-white/25 font-medium hover:text-white/50 transition-colors py-2"
              style={fieldLabel}
            >
              BACK
            </button>
          </div>
        </div>
      );

    // ─────────────────────────────────────────────────────────────
    // COMPONENT ▸ SETTINGS SCREEN  (account info, username, photo, logout)
    // ─────────────────────────────────────────────────────────────

    function SettingsScreen({ email, onClose, onLogout }) {
      const [user, setUser] = useState(() => AUTH.getUser(email));
      const [editingUsername, setEditingUsername] = useState(false);
      const [newUsername, setNewUsername] = useState('');
      const [editingBody, setEditingBody] = useState(false);
      const [newHeightFt, setNewHeightFt]   = useState('');
      const [newHeightIn, setNewHeightIn]   = useState('');
      const [newWeightLbs, setNewWeightLbs] = useState('');
      const [editingDob, setEditingDob]     = useState(false);
      const [newDob,      setNewDob]        = useState('');
      const [error, setError] = useState(null);
      const [info, setInfo]   = useState(null);
      const fileInputRef = React.useRef(null);

      const refresh = () => setUser(AUTH.getUser(email));

      const status = AUTH.usernameChangeStatus(email);

      const handlePhotoSelect = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          setError('Please select an image file.'); return;
        }
        try {
          const dataUrl = await resizeImageDataURL(file, 256);
          AUTH.updateProfilePicture(email, dataUrl);
          refresh();
          setInfo('Profile photo updated.');
          setError(null);
          setTimeout(() => setInfo(null), 2000);
        } catch {
          setError('Could not process that image.');
        }
      };

      const startEditUsername = () => {
        setNewUsername(user.username || '');
        setEditingUsername(true);
        setError(null);
      };

      const saveUsername = () => {
        const res = AUTH.changeUsername(email, newUsername);
        if (res.error) { setError(res.error); return; }
        refresh();
        setEditingUsername(false);
        setError(null);
        setInfo('Username updated.');
        setTimeout(() => setInfo(null), 2000);
      };

      const cancelEditUsername = () => {
        setEditingUsername(false);
        setError(null);
      };

      const startEditBody = () => {
        setNewHeightFt(String(user.heightFt ?? ''));
        setNewHeightIn(String(user.heightIn ?? ''));
        setNewWeightLbs(String(user.weightLbs ?? ''));
        setEditingBody(true);
        setError(null);
      };

      const saveBody = () => {
        const res = AUTH.updateBodyMetrics(email, {
          heightFt: newHeightFt, heightIn: newHeightIn, weightLbs: newWeightLbs,
        });
        if (res.error) { setError(res.error); return; }
        refresh();
        setEditingBody(false);
        setError(null);
        setInfo('Height and weight updated.');
        setTimeout(() => setInfo(null), 2000);
      };

      const cancelEditBody = () => {
        setEditingBody(false);
        setError(null);
      };

      const startEditDob = () => {
        setNewDob(user.dateOfBirth || '');
        setEditingDob(true);
        setError(null);
      };

      const saveDob = () => {
        // If a DOB already exists, this is the one-shot correction path.
        const res = user.dateOfBirth
          ? AUTH.correctDateOfBirth(email, newDob)
          : AUTH.setDateOfBirthOnce(email, newDob);
        if (res.error) { setError(res.error); return; }
        refresh();
        setEditingDob(false);
        setError(null);
        setInfo(user.dateOfBirth ? 'Date of birth corrected. Now locked.' : 'Date of birth saved.');
        setTimeout(() => setInfo(null), 2200);
      };

      const cancelEditDob = () => {
        setEditingDob(false);
        setError(null);
      };

      const formatDob = (iso) => {
        if (!iso) return '—';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      };

      const fieldLabel = { letterSpacing: '0.18em' };

      const liveHint = (() => {
        if (!editingUsername || !newUsername) return null;
        if (newUsername.toLowerCase() === (user.username || '').toLowerCase()) return null;
        const err = validateUsername(newUsername);
        if (err) return { ok: false, message: err };
        if (AUTH.usernameTaken(newUsername, email)) return { ok: false, message: 'That username is already taken.' };
        return { ok: true, message: 'Available.' };
      })();

      if (!user) return null;

      return (
        <div className="screen-enter flex flex-col min-h-screen px-6 pt-16 pb-10">
          <div className="flex-1">
            {/* Header */}
            <div className="flex items-center justify-between mb-10">
              <p
                className="text-xs text-white/25 font-medium"
                style={fieldLabel}
              >
                ACCOUNT SETTINGS
              </p>
              {onClose && (
                <button
                  onClick={onClose}
                  className="text-xs text-white/40 font-medium hover:text-white/70 transition-colors"
                  style={fieldLabel}
                >
                  CLOSE
                </button>
              )}
            </div>

            {/* Profile photo */}
            <div className="flex items-center gap-5 mb-10">
              <button
                onClick={() => fileInputRef.current?.click()}
                className="transition-opacity hover:opacity-80"
                style={{
                  width: 76, height: 76, borderRadius: '50%',
                  background: user.profilePicture ? `url(${user.profilePicture}) center/cover` : 'rgba(255,255,255,0.06)',
                  border: '1px solid rgba(255,255,255,0.18)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  padding: 0, cursor: 'pointer',
                }}
              >
                {!user.profilePicture && (
                  <span className="text-lg font-semibold text-white/75" style={{ letterSpacing: '0.04em' }}>
                    {(user.firstName?.[0] || '').toUpperCase()}{(user.lastName?.[0] || '').toUpperCase()}
                  </span>
                )}
              </button>
              <input ref={fileInputRef} type="file" accept="image/*" onChange={handlePhotoSelect} className="hidden" />
              <div className="flex flex-col gap-1">
                <p className="text-xs text-white/40 font-medium" style={fieldLabel}>
                  PROFILE PHOTO
                </p>
                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="text-xs text-white font-semibold hover:text-white/80 transition-colors text-left"
                  style={{ letterSpacing: '0.05em' }}
                >
                  {user.profilePicture ? 'Change photo' : 'Add photo'}
                </button>
              </div>
            </div>

            {/* Read-only fields */}
            <SettingsRow label="NAME" value={`${user.firstName} ${user.lastName}`} />
            <SettingsRow label="EMAIL" value={email} />
            {/* Date of Birth — one-time set if missing, otherwise locked */}
            <div className="py-5" style={{ borderTop: '1px solid rgba(255,255,255,0.07)' }}>
              <p className="text-xs text-white/40 font-medium mb-2" style={{ letterSpacing: '0.18em' }}>
                DATE OF BIRTH
              </p>
              {editingDob ? (
                <div className="flex flex-col gap-3">
                  <input
                    type="date"
                    value={newDob}
                    onChange={(e) => setNewDob(e.target.value)}
                    max={new Date().toISOString().split('T')[0]}
                    autoFocus
                    style={{
                      background: 'transparent', border: 'none',
                      borderBottom: '1px solid rgba(255,255,255,0.4)',
                      color: '#fff', fontSize: '15px', padding: '8px 0',
                      width: '100%', outline: 'none', fontFamily: 'inherit',
                      colorScheme: 'dark',
                    }}
                  />
                  <p className="text-xs text-white/35">
                    {user.dateOfBirth
                      ? 'This is your one-time correction. After saving, your date of birth is locked permanently.'
                      : 'Once saved, your date of birth can\'t be changed.'}
                  </p>
                  <div className="flex gap-3 mt-1">
                    <button
                      onClick={saveDob}
                      className="flex-1 bg-white text-black font-semibold text-xs py-3 hover:bg-white/90 transition-colors"
                      style={{ letterSpacing: '0.18em' }}
                    >
                      SAVE
                    </button>
                    <button
                      onClick={cancelEditDob}
                      className="flex-1 border border-white/20 text-white/60 font-medium text-xs py-3 hover:border-white/40 hover:text-white/80 transition-colors"
                      style={{ letterSpacing: '0.18em' }}
                    >
                      CANCEL
                    </button>
                  </div>
                </div>
              ) : user.dateOfBirth ? (
                <div className="flex items-center justify-between gap-4">
                  <p className="text-sm text-white">
                    {formatDob(user.dateOfBirth)}
                    {user.dobCorrected && (
                      <span className="text-xs text-white/35 ml-2">· locked</span>
                    )}
                  </p>
                  {!user.dobCorrected && (
                    <button
                      onClick={startEditDob}
                      className="text-xs text-white font-semibold hover:text-white/80 transition-colors"
                      style={{ letterSpacing: '0.18em' }}
                    >
                      EDIT
                    </button>
                  )}
                </div>
              ) : (
                <div className="flex items-center justify-between gap-4">
                  <p className="text-sm text-white/50 italic">Not set</p>
                  <button
                    onClick={startEditDob}
                    className="text-xs text-white font-semibold hover:text-white/80 transition-colors"
                    style={{ letterSpacing: '0.18em' }}
                  >
                    ADD
                  </button>
                </div>
              )}
              {user.dateOfBirth && !user.dobCorrected && !editingDob && (
                <p className="text-xs text-white/30 mt-2">
                  You have one correction available if you entered the wrong date.
                </p>
              )}
            </div>

            {/* Gender — private, read-only */}
            <div className="py-5" style={{ borderTop: '1px solid rgba(255,255,255,0.07)' }}>
              <div className="flex items-center mb-2">
                <p className="text-xs text-white/40 font-medium" style={{ letterSpacing: '0.18em' }}>
                  GENDER
                </p>
                <HelpHint>
                  Used only to personalize your training experience. Never shown publicly or shared outside your profile.
                </HelpHint>
              </div>
              <p className="text-sm text-white">
                {user.gender ? genderLabel(user.gender) : <span className="text-white/50 italic">Not set</span>}
                <span className="text-xs text-white/35 ml-2">· private</span>
              </p>
            </div>

            {/* Height + Weight (editable any time) */}
            <div className="py-5" style={{ borderTop: '1px solid rgba(255,255,255,0.07)' }}>
              <div className="flex items-center mb-2">
                <p className="text-xs text-white/40 font-medium" style={{ letterSpacing: '0.18em' }}>
                  HEIGHT & WEIGHT
                </p>
                <HelpHint>
                  Used to personalize your fitness program. Never shared outside your account.
                </HelpHint>
              </div>

              {!editingBody ? (
                <div className="flex items-center justify-between gap-4">
                  <p className="text-sm text-white">
                    {user.heightFt != null
                      ? `${user.heightFt}'${user.heightIn ?? 0}" · ${user.weightLbs} lbs`
                      : '— Not set'}
                  </p>
                  <button
                    onClick={startEditBody}
                    className="text-xs text-white font-semibold hover:text-white/80 transition-colors"
                    style={{ letterSpacing: '0.18em' }}
                  >
                    {user.heightFt != null ? 'CHANGE' : 'ADD'}
                  </button>
                </div>
              ) : (
                <div className="flex flex-col gap-4">
                  <div>
                    <p className="text-xs text-white/35 mb-2">Height</p>
                    <div className="grid grid-cols-2 gap-4">
                      <div className="flex items-baseline gap-2">
                        <input
                          type="number" inputMode="numeric" min="3" max="8"
                          value={newHeightFt}
                          onChange={(e) => setNewHeightFt(e.target.value)}
                          style={{
                            background: 'transparent', border: 'none',
                            borderBottom: '1px solid rgba(255,255,255,0.4)',
                            color: '#fff', fontSize: '15px', padding: '8px 0',
                            width: '100%', outline: 'none', fontFamily: 'inherit',
                          }}
                        />
                        <span className="text-xs text-white/40 shrink-0">ft</span>
                      </div>
                      <div className="flex items-baseline gap-2">
                        <input
                          type="number" inputMode="numeric" min="0" max="11"
                          value={newHeightIn}
                          onChange={(e) => setNewHeightIn(e.target.value)}
                          style={{
                            background: 'transparent', border: 'none',
                            borderBottom: '1px solid rgba(255,255,255,0.4)',
                            color: '#fff', fontSize: '15px', padding: '8px 0',
                            width: '100%', outline: 'none', fontFamily: 'inherit',
                          }}
                        />
                        <span className="text-xs text-white/40 shrink-0">in</span>
                      </div>
                    </div>
                  </div>
                  <div>
                    <p className="text-xs text-white/35 mb-2">Weight</p>
                    <div className="flex items-baseline gap-2">
                      <input
                        type="number" inputMode="decimal" min="50" max="800" step="0.1"
                        value={newWeightLbs}
                        onChange={(e) => setNewWeightLbs(e.target.value)}
                        style={{
                          background: 'transparent', border: 'none',
                          borderBottom: '1px solid rgba(255,255,255,0.4)',
                          color: '#fff', fontSize: '15px', padding: '8px 0',
                          width: '100%', outline: 'none', fontFamily: 'inherit',
                        }}
                      />
                      <span className="text-xs text-white/40 shrink-0">lbs</span>
                    </div>
                  </div>
                  <div className="flex gap-3 mt-1">
                    <button
                      onClick={saveBody}
                      className="flex-1 bg-white text-black font-semibold text-xs py-3 hover:bg-white/90 transition-colors"
                      style={{ letterSpacing: '0.18em' }}
                    >
                      SAVE
                    </button>
                    <button
                      onClick={cancelEditBody}
                      className="flex-1 border border-white/20 text-white/60 font-medium text-xs py-3 hover:border-white/40 hover:text-white/80 transition-colors"
                      style={{ letterSpacing: '0.18em' }}
                    >
                      CANCEL
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* Username with edit */}
            <div className="py-5" style={{ borderTop: '1px solid rgba(255,255,255,0.07)' }}>
              <p className="text-xs text-white/40 font-medium mb-2" style={fieldLabel}>
                USERNAME
              </p>

              {!editingUsername ? (
                <>
                  <div className="flex items-center justify-between gap-4">
                    <p className="text-sm text-white font-semibold">
                      @{user.username || '(none set)'}
                    </p>
                    <button
                      onClick={startEditUsername}
                      disabled={!status.canChange}
                      className={`text-xs font-semibold transition-colors ${status.canChange ? 'text-white hover:text-white/80' : 'text-white/25 cursor-not-allowed'}`}
                      style={{ letterSpacing: '0.18em' }}
                    >
                      CHANGE
                    </button>
                  </div>
                  <p className="text-xs text-white/35 mt-2">
                    {status.changesUsed} of {USERNAME_CHANGE_LIMIT} changes used.
                    {!status.canChange && status.reason ? ` ${status.reason}` : ''}
                  </p>
                </>
              ) : (
                <div className="flex flex-col gap-3">
                  <input
                    type="text"
                    value={newUsername}
                    onChange={(e) => setNewUsername(e.target.value)}
                    maxLength={24}
                    autoFocus
                    style={{
                      background: 'transparent',
                      border: 'none',
                      borderBottom: '1px solid rgba(255,255,255,0.4)',
                      color: '#fff',
                      fontSize: '15px',
                      padding: '8px 0',
                      width: '100%',
                      outline: 'none',
                      fontFamily: 'inherit',
                    }}
                  />
                  <p className="text-xs text-white/30">
                    Less than 25 characters, no spaces or profanity. {newUsername.length}/24
                  </p>
                  {liveHint && (
                    <p className={`text-xs font-medium ${liveHint.ok ? 'text-white/70' : 'text-red-400'}`}>
                      {liveHint.message}
                    </p>
                  )}
                  <p className="text-xs text-white/35">
                    {status.changesRemaining - 1 < 0 ? 0 : status.changesRemaining - 1} change{status.changesRemaining - 1 === 1 ? '' : 's'} will remain after this. You can change again in {USERNAME_CHANGE_COOLDOWN_DAYS} days.
                  </p>
                  <div className="flex gap-3 mt-1">
                    <button
                      onClick={saveUsername}
                      className="flex-1 bg-white text-black font-semibold text-xs py-3 hover:bg-white/90 transition-colors"
                      style={fieldLabel}
                    >
                      SAVE
                    </button>
                    <button
                      onClick={cancelEditUsername}
                      className="flex-1 border border-white/20 text-white/60 font-medium text-xs py-3 hover:border-white/40 hover:text-white/80 transition-colors"
                      style={fieldLabel}
                    >
                      CANCEL
                    </button>
                  </div>
                </div>
              )}
            </div>

            {(error || info) && (
              <p className={`text-xs mt-2 font-medium ${error ? 'text-red-400' : 'text-white/70'}`}>
                {error || info}
              </p>
            )}
          </div>

          {/* Logout */}
          <button
            onClick={() => {
              if (window.confirm('Log out of TRNSFRM?')) onLogout();
            }}
            className="mt-10 w-full border border-white/15 text-white/60 font-medium text-xs py-4 hover:border-white/35 hover:text-white/80 transition-colors"
            style={fieldLabel}
          >
            LOG OUT
          </button>
        </div>
      );
    }

    function SettingsRow({ label, value }) {
      return (
        <div className="py-5" style={{ borderTop: '1px solid rgba(255,255,255,0.07)' }}>
          <p className="text-xs text-white/40 font-medium mb-2" style={{ letterSpacing: '0.18em' }}>
            {label}
          </p>
          <p className="text-sm text-white">
            {value}
          </p>
        </div>

    }

    // ─────────────────────────────────────────────────────────────
    // COMPONENT ▸ WELCOME SCREEN  (tagline, subtext, primary CTAs)
    // ─────────────────────────────────────────────────────────────

    function WelcomeScreen({ onStart, onSkip }) {
      return (
        <div className="screen-enter flex flex-col min-h-screen px-6 pt-16 pb-10">
          {/* small lockup at top for brand continuity */}

    function QuizScreen({ onComplete }) {
      const [step, setStep]         = useState(0);
      const [answers, setAnswers]   = useState([]);
      const [selected, setSelected] = useState(null);
      const [animKey, setAnimKey]   = useState(0);

      const question    = QUESTIONS[step];
      const total       = QUESTIONS.length;
      const progressPct = ((step + 1) / total) * 100;

      const handleSelect = useCallback((answer) => {
        if (selected) return; // prevent double-tap
        setSelected(answer);

        setTimeout(() => {
          const updated = [...answers, answer];
          if (step + 1 >= total) {
            onComplete(updated);
          } else {
            setAnswers(updated);
            setStep(s => s + 1);
            setSelected(null);
            setAnimKey(k => k + 1);
          }
        }, 280);
      }, [selected, answers, step, total, onComplete]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Progress bar */}
          <div className="w-full h-px bg-white/10">
            <div
              className="h-full bg-white progress-fill"
              style={{ width: `${progressPct}%` }}
            />
          </div>

          <div key={animKey} className="screen-enter flex flex-col flex-1 px-6 pt-10 pb-10">
            {/* Counter */}
            <p
              className="text-xs text-white/25 font-medium mb-10"
              style={{ letterSpacing: '0.18em' }}
            >
              {step + 1} / {total}
            </p>

            {/* Question */}
            <h2 className="text-2xl font-bold leading-snug text-white mb-10">
              {question.text}
            </h2>

            {/* Answer cards */}
            <div className="flex flex-col gap-3 flex-1">
              {question.answers.map((answer, i) => {
                const isSelected = selected === answer;
                return (
                  <button
                    key={i}
                    onClick={() => handleSelect(answer)}
                    className={`answer-card w-full text-left px-5 py-4 border text-sm font-medium leading-snug
                      ${isSelected
                        ? 'bg-white text-black border-white selected'
                        : 'bg-transparent text-white/70 border-white/12 hover:border-white/35 hover:text-white'
                      }`}
                    style={!isSelected ? { borderColor: 'rgba(255,255,255,0.12)' } : {}}
                  >
                    {answer.text}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function WorkoutCreatorScreen({ onSave, onCancel, error }) {
      const [name, setName] = useState('');
      const [type, setType] = useState('Hypertrophy');
      const [duration, setDuration] = useState('');
      const [description, setDescription] = useState('');
      const [rows, setRows] = useState([{ label: '', detail: '' }, { label: '', detail: '' }, { label: '', detail: '' }]);
      const [localError, setLocalError] = useState(null);

      const updateRow = (i, key, value) => {
        setRows(rows.map((r, idx) => idx === i ? { ...r, [key]: value } : r));
      };
      const addRow    = () => setRows([...rows, { label: '', detail: '' }]);
      const removeRow = (i) => setRows(rows.filter((_, idx) => idx !== i));

      const handleSave = () => {
        if (!name.trim())     { setLocalError('Name is required.'); return; }
        if (!duration.trim()) { setLocalError('Add an estimated duration (e.g., "~60 min").'); return; }
        const cleanRows = rows
          .map((r) => ({ label: r.label.trim(), detail: r.detail.trim() }))
          .filter((r) => r.label || r.detail);
        if (cleanRows.length === 0) { setLocalError('Add at least one exercise.'); return; }
        const schedule = cleanRows.map((r, i) => ({
          num: String(i + 1).padStart(2, '0'),
          label: r.label || 'Exercise',
          detail: r.detail || '',

        setLocalError(null);
        onSave({
          name: name.trim(),
          type,
          duration: duration.trim(),
          description: description.trim() || `Custom ${type.toLowerCase()} workout.`,

    function ProgramCreatorScreen({ onSave, onCancel, error }) {
      const [name, setName] = useState('');
      const [category, setCategory] = useState('hypertrophy');
      const [weeks, setWeeks] = useState('4');
      const [daysPerWeek, setDaysPerWeek] = useState('5');
      const [description, setDescription] = useState('');
      const [rows, setRows] = useState(
        Array.from({ length: 7 }, () => ({ label: '', detail: '' }))

      const [localError, setLocalError] = useState(null);

      const updateRow = (i, key, value) => {
        setRows(rows.map((r, idx) => idx === i ? { ...r, [key]: value } : r));
      };
      const addRow    = () => setRows([...rows, { label: '', detail: '' }]);
      const removeRow = (i) => setRows(rows.filter((_, idx) => idx !== i));

      const handleSave = () => {
        if (!name.trim()) { setLocalError('Name is required.'); return; }
        const w = Number(weeks);
        if (!Number.isFinite(w) || w < 3 || w > 6) {
          setLocalError('Weeks must be between 3 and 6.'); return;
        }
        const d = Number(daysPerWeek);
        if (!Number.isFinite(d) || d < 1 || d > 7) {
          setLocalError('Days per week must be between 1 and 7.'); return;
        }
        const cleanRows = rows
          .map((r) => ({ label: r.label.trim(), detail: r.detail.trim() }))
          .filter((r) => r.label || r.detail);
        if (cleanRows.length === 0) { setLocalError('Add at least one day.'); return; }
        const schedule = cleanRows.map((r, i) => ({
          num: String(i + 1).padStart(2, '0'),
          label: r.label || 'Day',
          detail: r.detail || '',
        }));
        setLocalError(null);
        onSave({
          name: name.trim(),
          category,
          weeks: w,
          daysPerWeek: d,
          description: description.trim() || `Custom ${category} program.`,
          schedule,
        });

      return (
        <div className="screen-enter flex flex-col min-h-screen px-6 pt-16 pb-10">
          <div className="flex-1">
            <p className="text-xs text-white/25 font-medium mb-3" style={creatorLabelStyle}>

            <h1 className="text-3xl font-black text-white uppercase leading-tight mb-3">

            <div className="flex flex-col gap-7">

              <div>
                <label className="text-xs text-white/40 font-medium block mb-2" style={creatorLabelStyle}>
                  CATEGORY
                </label>
                <div className="grid grid-cols-2 gap-2">
                  {[
                    { id: 'hypertrophy',  label: 'Hypertrophy' },
                    { id: 'powerlifting', label: 'Powerlifting' },
                  ].map((c) => {
                    const active = category === c.id;
                    return (
                      <button

                        onClick={() => setCategory(c.id)}
                        className={`text-sm font-semibold py-3 border transition-colors ${active ? 'bg-white text-black border-white' : 'text-white/70 hover:text-white'}`}
                        style={!active ? { borderColor: 'rgba(255,255,255,0.15)' } : {}}

                        {c.label}

                  })}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-xs text-white/40 font-medium block mb-2" style={creatorLabelStyle}>
                    WEEKS
                  </label>
                  <input
                    type="number" min="3" max="6"
                    value={weeks}
                    onChange={(e) => setWeeks(e.target.value)}
                    style={creatorInputStyle}
                  />
                </div>
                <div>
                  <label className="text-xs text-white/40 font-medium block mb-2" style={creatorLabelStyle}>
                    DAYS / WEEK
                  </label>
                  <input
                    type="number" min="1" max="7"
                    value={daysPerWeek}
                    onChange={(e) => setDaysPerWeek(e.target.value)}
                    style={creatorInputStyle}
                  />
                </div>
              </div>

              <div>
                <label className="text-xs text-white/40 font-medium block mb-2" style={creatorLabelStyle}>
                  DESCRIPTION
                </label>
                <textarea
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  placeholder="What's this program for?"
                  rows={3}
                  style={{ ...creatorInputStyle, resize: 'vertical' }}
                />
              </div>

              <div>
                <div className="flex items-center justify-between mb-3">
                  <label className="text-xs text-white/40 font-medium" style={creatorLabelStyle}>
                    WEEKLY STRUCTURE
                  </label>
                  <button
                    type="button"
                    onClick={addRow}
                    className="text-xs text-white font-semibold hover:text-white/80 transition-colors"
                    style={creatorLabelStyle}
                  >
                    + ADD
                  </button>
                </div>
                <div className="flex flex-col">
                  {rows.map((row, i) => (
                    <CreatorRow
                      key={i}
                      index={i}
                      label={row.label}
                      detail={row.detail}
                      onLabelChange={(v)  => updateRow(i, 'label', v)}
                      onDetailChange={(v) => updateRow(i, 'detail', v)}
                      onRemove={() => removeRow(i)}
                      canRemove={rows.length > 1}
                      labelPlaceholder="Day name (e.g. Push)"
                      detailPlaceholder="Focus or notes (e.g. Chest · Shoulders · Triceps)"

              {(localError || error) && (

          <div className="pt-8 flex flex-col gap-3">
            <button
              onClick={handleSave}
              className="w-full bg-white text-black font-semibold text-xs py-4 hover:bg-white/90 active:bg-white/80 transition-colors"
              style={creatorLabelStyle}
            >
              SAVE PROGRAM
            </button>
            <button
              onClick={onCancel}
              className="w-full border border-white/20 text-white/60 font-medium text-xs py-4 hover:border-white/40 hover:text-white/80 transition-colors"
              style={creatorLabelStyle}

    // ─────────────────────────────────────────────────────────────
    // COMPONENT ▸ REST TIMER  (sticky countdown after marking a set done)
    // ─────────────────────────────────────────────────────────────

    function RestTimer({ seconds, onSkip, onDone, bottomOffset = 72 }) {
      const [remaining, setRemaining] = useState(seconds);

      useEffect(() => {
        setRemaining(seconds);
      }, [seconds]);

      useEffect(() => {
        if (remaining <= 0) {
          if (onDone) onDone();
          return;
        }
        const t = setTimeout(() => setRemaining((r) => r - 1), 1000);
        return () => clearTimeout(t);
      }, [remaining]);

      const mins = Math.floor(Math.max(0, remaining) / 60);
      const secs = Math.max(0, remaining) % 60;

      return (
        <div
          style={{
            position: 'fixed',
            bottom: bottomOffset,
            left: 0,
            right: 0,
            zIndex: 35,
            display: 'flex',
            justifyContent: 'center',
            pointerEvents: 'none',
          }}
        >
          <div
            style={{
              width: '100%',
              maxWidth: 448,
              margin: '0 8px',
              background: 'rgba(255,255,255,0.06)',
              backdropFilter: 'blur(8px)',
              WebkitBackdropFilter: 'blur(8px)',
              border: '1px solid rgba(255,255,255,0.15)',
              padding: '14px 18px',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              pointerEvents: 'auto',
            }}
          >
            <div>
              <p
                className="text-xs text-white/40 font-medium"
                style={{ letterSpacing: '0.22em' }}
              >
                REST
              </p>
              <p
                className="font-display text-white"
                style={{ fontSize: 28, fontWeight: 600, letterSpacing: '0.04em', lineHeight: 1 }}
              >
                {mins}:{String(secs).padStart(2, '0')}
              </p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => setRemaining((r) => r + 15)}
                className="text-xs text-white/60 font-semibold hover:text-white transition-colors"
                style={{ letterSpacing: '0.18em', padding: '8px 10px', border: '1px solid rgba(255,255,255,0.2)' }}
              >
                +15s
              </button>
              <button
                onClick={onSkip}
                className="text-xs text-white font-semibold hover:text-white/80 transition-colors"
                style={{ letterSpacing: '0.18em', padding: '8px 14px', background: '#fff', color: '#000' }}
              >
                SKIP
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // COMPONENT ▸ ACTIVE WORKOUT  (live session tracking)
    // ─────────────────────────────────────────────────────────────

    function ActiveWorkoutScreen({ item, prs, onFinish, onCancel }) {
      const startedAtRef = React.useRef(Date.now());

      // Drop rest days from the schedule when constructing exercise rows
      const initialExercises = React.useMemo(() => {
        return (item.schedule || [])
          .filter((row) => !/^rest$/i.test((row.label || '').trim()))
          .map((row) => ({
            name: row.label || 'Exercise',
            detail: row.detail || '',
            sets: Array.from({ length: parseSetCount(row.detail) }, () => ({
              weight: '', reps: '', completed: false,
            })),
          }));
      }, [item]);

      const [exercises, setExercises] = useState(initialExercises);
      const [restKey, setRestKey] = useState(null); // `${eIdx}-${sIdx}` while resting

      const updateSet = (eIdx, sIdx, key, value) => {
        setExercises((prev) => prev.map((ex, i) =>
          i !== eIdx ? ex : {
            ...ex,
            sets: ex.sets.map((s, j) => j !== sIdx ? s : { ...s, [key]: value }),
          }
        ));
      };

      const toggleSetComplete = (eIdx, sIdx) => {
        const ex  = exercises[eIdx];
        const set = ex.sets[sIdx];
        const willComplete = !set.completed;
        // Require both weight and reps before marking complete
        if (willComplete && (!set.weight || !set.reps)) return;

        setExercises((prev) => prev.map((e, i) =>
          i !== eIdx ? e : {
            ...e,
            sets: e.sets.map((s, j) => j !== sIdx ? s : { ...s, completed: willComplete }),
          }
        ));

        if (willComplete) setRestKey(`${eIdx}-${sIdx}-${Date.now()}`);
        else if (restKey?.startsWith(`${eIdx}-${sIdx}-`)) setRestKey(null);
      };

      const addSet = (eIdx) => {
        setExercises((prev) => prev.map((ex, i) =>
          i !== eIdx ? ex : { ...ex, sets: [...ex.sets, { weight: '', reps: '', completed: false }] }
        ));
      };

      const removeSet = (eIdx, sIdx) => {
        setExercises((prev) => prev.map((ex, i) =>
          i !== eIdx ? ex : { ...ex, sets: ex.sets.filter((_, j) => j !== sIdx) }
        ));
      };

      const totalCompleted = exercises.reduce((sum, ex) =>
        sum + ex.sets.filter((s) => s.completed).length, 0);
      const totalExercises = exercises.length;
      const exercisesTouched = exercises.filter((ex) => ex.sets.some((s) => s.completed)).length;

      const handleFinish = () => {
        const session = {
          id: `session-${Date.now()}`,
          itemId:    item.id,
          itemName:  item.name,
          itemType:  item.weeks ? 'program' : 'workout',
          startedAt: startedAtRef.current,
          exercises: exercises
            .map((ex) => ({
              name: ex.name,
              sets: ex.sets
                .filter((s) => s.completed && s.weight && s.reps)
                .map((s) => ({
                  weight: Number(s.weight),
                  reps:   Number(s.reps),
                })),
            }))
            .filter((ex) => ex.sets.length > 0),
        };
        onFinish(session);
      };

      const inputStyle = {
        background: 'transparent',
        border: 'none',
        borderBottom: '1px solid rgba(255,255,255,0.2)',
        color: '#fff',
        fontSize: 15,
        padding: '6px 0',
        width: '100%',
        outline: 'none',
        textAlign: 'center',
        fontFamily: 'inherit',
      };

      return (
        <div className="screen-enter flex flex-col min-h-screen px-6 pt-16 pb-24">
          <div className="flex-1">
            <p
              className="text-xs text-white/25 font-medium mb-3"
              style={{ letterSpacing: '0.18em' }}
            >
              ACTIVE SESSION
            </p>
            <h1 className="text-2xl font-black text-white uppercase leading-tight mb-2">
              {item.name}
            </h1>
            <p className="text-xs text-white/40 mb-8">
              {exercisesTouched} of {totalExercises} exercises · {totalCompleted} sets done
            </p>

            <div className="flex flex-col gap-7">
              {exercises.map((ex, eIdx) => {
                const pr = prs?.[ex.name];
                return (
                  <div key={eIdx}>
                    <div className="flex items-baseline justify-between gap-3 mb-1">
                      <p className="text-sm font-bold text-white uppercase tracking-wide">
                        {ex.name}
                      </p>
                      {pr && (
                        <p className="text-[10px] text-white/40 font-medium" style={{ letterSpacing: '0.06em' }}>
                          PR · {pr.weight}×{pr.reps}
                        </p>
                      )}
                    </div>
                    <p className="text-xs text-white/35 mb-3">{ex.detail}</p>

                    {/* Header row */}
                    <div
                      className="grid items-center gap-2 mb-1"
                      style={{ gridTemplateColumns: '24px 1fr 1fr 36px 28px' }}
                    >
                      <span className="text-[10px] text-white/30 font-semibold" style={{ letterSpacing: '0.08em' }}>SET</span>
                      <span className="text-[10px] text-white/30 font-semibold text-center" style={{ letterSpacing: '0.08em' }}>WEIGHT</span>
                      <span className="text-[10px] text-white/30 font-semibold text-center" style={{ letterSpacing: '0.08em' }}>REPS</span>
                      <span />
                      <span />
                    </div>

                    {ex.sets.map((s, sIdx) => (
                      <div
                        key={sIdx}
                        className="grid items-center gap-2 py-1"
                        style={{
                          gridTemplateColumns: '24px 1fr 1fr 36px 28px',
                          opacity: s.completed ? 1 : 0.95,
                        }}
                      >
                        <span className="text-xs font-mono text-white/40">{sIdx + 1}</span>
                        <input
                          type="number" inputMode="decimal"
                          value={s.weight}
                          onChange={(e) => updateSet(eIdx, sIdx, 'weight', e.target.value)}
                          disabled={s.completed}
                          placeholder="lbs"
                          style={{
                            ...inputStyle,
                            borderBottomColor: s.completed ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.2)',
                            color: s.completed ? '#fff' : '#fff',
                          }}
                        />
                        <input
                          type="number" inputMode="numeric"
                          value={s.reps}
                          onChange={(e) => updateSet(eIdx, sIdx, 'reps', e.target.value)}
                          disabled={s.completed}
                          placeholder="reps"
                          style={{
                            ...inputStyle,
                            borderBottomColor: s.completed ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.2)',
                          }}
                        />
                        <button
                          onClick={() => toggleSetComplete(eIdx, sIdx)}
                          aria-label={s.completed ? 'Mark set incomplete' : 'Mark set complete'}
                          style={{
                            width: 32, height: 32,
                            border: '1px solid rgba(255,255,255,0.25)',
                            background: s.completed ? '#fff' : 'transparent',
                            color: s.completed ? '#000' : 'rgba(255,255,255,0.5)',
                            fontSize: 14,
                            fontWeight: 700,
                            cursor: 'pointer',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                          }}
                        >
                          ✓
                        </button>
                        {ex.sets.length > 1 ? (
                          <button
                            onClick={() => removeSet(eIdx, sIdx)}
                            aria-label="Remove set"
                            className="text-white/25 hover:text-red-400 transition-colors"
                            style={{ fontSize: 16, lineHeight: 1, background: 'transparent', border: 'none', cursor: 'pointer' }}
                          >
                            ×
                          </button>
                        ) : <span />}
                      </div>
                    ))}

                    <button
                      onClick={() => addSet(eIdx)}
                      className="text-xs text-white/50 font-semibold hover:text-white transition-colors mt-2"
                      style={{ letterSpacing: '0.18em' }}
                    >
                      + ADD SET
                    </button>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Sticky rest timer banner */}
          {restKey && (
            <RestTimer
              key={restKey}
              seconds={DEFAULT_REST_SECONDS}
              onSkip={() => setRestKey(null)}
              onDone={() => setRestKey(null)}
            />
          )}

          <div className="pt-8 flex flex-col gap-3">
            <button
              onClick={handleFinish}
              disabled={totalCompleted === 0}
              className={`w-full font-semibold text-xs py-4 transition-colors ${
                totalCompleted === 0
                  ? 'bg-white/10 text-white/30 cursor-not-allowed'
                  : 'bg-white text-black hover:bg-white/90 cursor-pointer'
              }`}
              style={{ letterSpacing: '0.18em' }}
            >
              FINISH WORKOUT
            </button>
            <button
              onClick={onCancel}
              className="w-full text-white/35 font-medium text-xs py-3 hover:text-white/60 transition-colors"
              style={{ letterSpacing: '0.18em' }}
            >
              CANCEL
            </button>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // COMPONENT ▸ WORKOUT SUMMARY  (post-session recap + PR display)
    // ─────────────────────────────────────────────────────────────

        sum + ex.sets.reduce((s, set) => s + set.weight * set.reps, 0), 0);

              SESSION COMPLETE

              {session.itemName}

            <p className="text-sm text-white/45 mb-10">

              style={{ background: 'rgba(255,255,255,0.08)' }}

                ['EXERCISES', session.exercises.length],
                ['SETS',      totalSets],

                    className="text-[10px] text-white/35 font-medium mb-1"
                    style={{ letterSpacing: '0.18em' }}

                    {label}
                  </p>
                  <p className="text-2xl font-black text-white">{val}</p>
                </div>
              ))}
            </div>

            {/* Volume */}
            <div className="mb-10">
              <p className="text-[10px] text-white/35 font-medium mb-1" style={{ letterSpacing: '0.22em' }}>
                TOTAL VOLUME
              </p>
              <p className="text-2xl font-black text-white">
                {totalVolume.toLocaleString()} <span className="text-base text-white/40 font-medium">lbs</span>
              </p>

              <div className="mb-10">

                        {pr.exercise}

                          <span className="text-white/35"> (was {pr.previousE1RM})</span>

                      </p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          <button
            onClick={onDone}
            className="w-full bg-white text-black font-semibold text-xs py-4 hover:bg-white/90 transition-colors"
            style={{ letterSpacing: '0.18em' }}
          >
            DONE
          </button>
        </div>
      );
