            </p>
            <p className="text-sm text-white/55 leading-relaxed mb-12">
              {item.description}
            </p>

            <p
              className="text-xs text-white/25 font-medium mb-6"
              style={{ letterSpacing: '0.18em' }}
            >
              {sectionLabel}
            </p>

            <div className="flex flex-col">
              {item.schedule.map((row, i) => (
                <div
                  key={i}
                  className="flex items-start gap-5 py-4"
                  style={{
                    borderBottom: i < item.schedule.length - 1
                      ? '1px solid rgba(255,255,255,0.07)'
                      : 'none',
                  }}
                >
                  <span className="text-xs font-mono pt-px w-5 shrink-0" style={{ color: 'rgba(255,255,255,0.18)' }}>
                    {row.num}
                  </span>
                  <div>
                    <p className="text-sm font-semibold text-white leading-none mb-1">
                      {row.label}
                    </p>
                    <p className="text-xs text-white/40">
                      {row.detail}
                    </p>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="pt-10 flex flex-col gap-3">
            <button
              onClick={() => onStart && onStart(item)}
              className="w-full bg-white text-black font-semibold text-xs py-4 px-6 hover:bg-white/90 active:bg-white/80 transition-colors"
              style={{ letterSpacing: '0.18em' }}
            >
              {isWorkout ? 'START WORKOUT' : 'START PROGRAM'}
            </button>
            <button
              onClick={onBack}
              className="w-full border border-white/20 text-white/60 font-medium text-xs py-4 px-6 hover:border-white/40 hover:text-white/80 transition-colors"
              style={{ letterSpacing: '0.18em' }}
            >
              BACK TO MENU
            </button>
            <button
              onClick={onReset}
              className="w-full text-white/25 font-medium text-xs py-3 hover:text-white/50 transition-colors"
              style={{ letterSpacing: '0.18em' }}
            >
              START OVER
            </button>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // COMPONENT ▸ DAILY SPORT SCREEN  (multi-sport athletes pick today's focus)
    // ─────────────────────────────────────────────────────────────

    function DailySportScreen({ sports, onPick }) {
      return (
        <div className="screen-enter flex flex-col min-h-screen px-6 pt-16 pb-10">
          <div className="flex-1">
            <p
              className="text-xs text-white/25 font-medium mb-5"
              style={{ letterSpacing: '0.18em' }}
            >
              TODAY'S FOCUS
            </p>
            <h2 className="text-3xl font-black text-white uppercase leading-tight mb-3">
              Which sport are<br />you training<br />for today?
            </h2>
            <p className="text-sm text-gray-400 mb-10">
              Pick the one you'll focus on for this session. You can switch any time.
            </p>

            <div className="flex flex-col gap-3">
              {sports.map((sport) => (
                <button
                  key={sport}
                  onClick={() => onPick(sport)}
                  className="answer-card w-full text-left px-5 py-5 border hover:border-white/40 group transition-colors"
                  style={{ borderColor: 'rgba(255,255,255,0.15)' }}
                >
                  <div className="flex items-center justify-between gap-4">
                    <p className="text-sm font-bold text-white uppercase tracking-wide">
                      {sport}
                    </p>
                    <span className="text-white/20 group-hover:text-white/50 transition-colors shrink-0 text-base">
                      →
                    </span>
                  </div>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // COMPONENT ▸ PROGRAM SCREEN
    // ─────────────────────────────────────────────────────────────

    function ProgramScreen({ laneKey, activeSport, hasMultipleSports, onReset, onSwitchSport }) {
      const lane    = LANES[laneKey];
      const program = PROGRAMS[laneKey];

      // Personalize Competitor program copy for today's active sport
      let title = program.title;
      let description = program.description;
      let sportLabel = null;

      if (laneKey === 'Competitor' && activeSport) {
        const sportName = activeSport === 'Other' ? 'your sport' : activeSport;
        title = activeSport === 'Other'
          ? 'Sport Performance Program'
          : `${activeSport} Performance Program`;
        description = `A 6-day performance program built around ${sportName} — sport practice, speed and power development, and competition prep.`;
        sportLabel = activeSport;
      }

      return (
        <div className="screen-enter flex flex-col min-h-screen px-6 pt-16 pb-10">
          <div className="flex-1">
            {/* Header */}
            <p
              className="text-xs text-white/25 font-medium mb-3"
              style={{ letterSpacing: '0.18em' }}
            >
              {lane.label.toUpperCase()}
            </p>
            <h1 className="text-3xl font-black text-white uppercase leading-tight mb-4">
              {title}
            </h1>
            <p className="text-sm text-white/45 leading-relaxed mb-12">
              {description}
            </p>

            {sportLabel && (
              <div
                className="border p-4 mb-12"
                style={{ borderColor: 'rgba(255,255,255,0.1)', background: 'rgba(255,255,255,0.03)' }}
              >
                <p
                  className="text-xs text-white/25 font-medium mb-1"
                  style={{ letterSpacing: '0.15em' }}
                >
                  TRAINING FOR
                </p>
                <p className="text-white font-semibold text-sm">
                  {sportLabel}
                </p>
              </div>
            )}

            {/* Weekly structure */}
            <p
              className="text-xs text-white/25 font-medium mb-6"
              style={{ letterSpacing: '0.18em' }}
            >
              WEEKLY STRUCTURE
            </p>

            <div className="flex flex-col">
              {program.days.map((day, i) => (
                <div
                  key={i}
                  className="flex items-start gap-5 py-4"
                  style={{
                    borderBottom: i < program.days.length - 1
                      ? '1px solid rgba(255,255,255,0.07)'
                      : 'none',
                  }}
                >
                  <span className="text-xs text-white/18 font-mono pt-px w-5 shrink-0" style={{ color: 'rgba(255,255,255,0.18)' }}>
                    {day.num}
                  </span>
                  <div>
                    <p className="text-sm font-semibold text-white leading-none mb-1">
                      {day.label}
                    </p>
                    <p className="text-xs text-white/40">
                      {day.detail}
                    </p>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* CTAs */}
          <div className="pt-10 flex flex-col gap-3">
            <button
              className="w-full bg-white text-black font-semibold text-xs py-4 px-6 hover:bg-white/90 active:bg-white/80 transition-colors"
              style={{ letterSpacing: '0.18em' }}
            >
              START TODAY
            </button>
            {hasMultipleSports && (
              <button
                onClick={onSwitchSport}
                className="w-full border border-white/20 text-white/60 font-medium text-xs py-4 px-6 hover:border-white/40 hover:text-white/80 transition-colors"
                style={{ letterSpacing: '0.18em' }}
              >
                SWITCH SPORT
              </button>
            )}
            <button
              onClick={onReset}
              className="w-full text-white/25 font-medium text-xs py-3 hover:text-white/50 transition-colors"
              style={{ letterSpacing: '0.18em' }}
            >
              START OVER
            </button>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // APP ▸ ROOT
    // ─────────────────────────────────────────────────────────────

    function App() {
      const [screen,    setScreen]    = useState('splash');
      const [primary,   setPrimary]   = useState(null);
      const [secondary, setSecondary] = useState(null);
      const [activeLane,         setActiveLane]         = useState(null);
      const [sports,             setSports]             = useState([]);
      const [activeSport,        setActiveSport]        = useState(null);
      const [builderItemId,      setBuilderItemId]      = useState(null);
      const [currentUser,        setCurrentUser]        = useState(null);
      const [authError,          setAuthError]          = useState(null);
      const [activeWorkoutItem,  setActiveWorkoutItem]  = useState(null);
      const [lastSession,        setLastSession]        = useState(null);
      const [lastSessionPRs,     setLastSessionPRs]     = useState([]);

      // Remove loading overlay once React is running
      useEffect(() => {
        const el = document.getElementById('loading');
        if (el) el.style.display = 'none';
        // Restore session if exists
        const email = AUTH.currentEmail();
        if (email) setCurrentUser(email);
      }, []);

      // Auto-persist results whenever state changes for a logged-in user
      useEffect(() => {
        if (!currentUser) return;
        if (!primary && !activeLane) return;
        AUTH.saveResults(currentUser, {
          primary, secondary, activeLane, sports, activeSport, builderItemId,
        });
      }, [currentUser, primary, secondary, activeLane, sports, activeSport, builderItemId]);

      // Route to the right next screen based on lane
      const enterProgram = useCallback((laneKey) => {
        setActiveLane(laneKey);
        if (laneKey === 'Competitor') {
          setScreen('sportSelect');
        } else if (laneKey === 'Builder') {
          setScreen('builderMenu');
        } else {
          setScreen('program');
        }
      }, []);

      const handleQuizComplete = useCallback((answers) => {
        const { primary: p, secondary: s } = calculateResults(answers);
        setPrimary(p);
        setSecondary(s);
        setScreen('results');
      }, []);

      const handleResultsContinue = useCallback(() => {
        // If not logged in, gate program behind account creation
        if (!currentUser) {
          setAuthError(null);
          setScreen('signup');
          return;
        }
        enterProgram(primary);
      }, [primary, enterProgram, currentUser]);

      const handleSignup = useCallback((payload) => {
        const res = AUTH.signup(payload);
        if (res.error) { setAuthError(res.error); return; }
        setAuthError(null);
        setCurrentUser(res.email);

        // Resume wherever the user was headed before the auth gate
        if (activeLane === 'Competitor') {
          setScreen('sportSelect');
        } else if (activeLane === 'Builder') {
          setScreen('builderMenu');
        } else if (activeLane) {
          setScreen('program');
        } else if (primary) {
          enterProgram(primary);
        } else {
          setScreen('welcome');
        }
      }, [primary, activeLane, enterProgram]);

      const handleLogin = useCallback(({ email, password }) => {
        const res = AUTH.login(email, password);
        if (res.error) { setAuthError(res.error); return; }
        setAuthError(null);
        setCurrentUser(res.email);

        // Restore prior session if it exists
        const r = res.results;
        if (r && r.activeLane) {
          if (r.primary)        setPrimary(r.primary);
          if (r.secondary)      setSecondary(r.secondary);
          setActiveLane(r.activeLane);
          if (r.sports)         setSports(r.sports);
          if (r.activeSport)    setActiveSport(r.activeSport);
          if (r.builderItemId)  setBuilderItemId(r.builderItemId);

          // Take user back to the right screen for their lane
          if (r.activeLane === 'Builder') {
            setScreen(r.builderItemId ? 'builderDetail' : 'builderMenu');
          } else {
            setScreen('program');
          }
        } else {
          setScreen('welcome');
        }
      }, []);

      const handleLogout = useCallback(() => {
        AUTH.logout();
        setCurrentUser(null);
        setPrimary(null);
        setSecondary(null);
        setActiveLane(null);
        setSports([]);
        setActiveSport(null);
        setScreen('splash');
      }, []);

      const handleLaneSelect = useCallback((key) => {
        // Remember which lane was picked even if we detour through signup
        setActiveLane(key);
        if (!currentUser) {
          setAuthError(null);
          setScreen('signup');
          return;
        }
        // Already logged in — proceed to the right next screen for this lane
        if (key === 'Competitor')      setScreen('sportSelect');
        else if (key === 'Builder')    setScreen('builderMenu');
        else                           setScreen('program');
      }, [currentUser]);

      const handleSportsContinue = useCallback((picked) => {
        setSports(picked);
        if (picked.length === 1) {
          setActiveSport(picked[0]);
          setScreen('program');
        } else {
          setActiveSport(null);
          setScreen('dailySport');
        }
      }, []);

      const handleDailySportPick = useCallback((sport) => {
        setActiveSport(sport);
        setScreen('program');
      }, []);

      const handleSwitchSport = useCallback(() => {
        setScreen('dailySport');
      }, []);

      const handleBuilderSelect = useCallback((item) => {
        setBuilderItemId(item.id);
        setScreen('builderDetail');
      }, []);

      const handleBuilderBackToMenu = useCallback(() => {
        setBuilderItemId(null);
        setScreen('builderMenu');
      }, []);

      const handleCreateWorkout = useCallback(() => {
        setScreen('workoutCreator');
      }, []);

      const handleCreateProgram = useCallback(() => {
        setScreen('programCreator');
      }, []);

      const handleSaveCustomWorkout = useCallback((workout) => {
        if (!currentUser) return;
        const res = AUTH.addCustomWorkout(currentUser, workout);
        if (res.error) return;
        // Open the new workout's detail screen
        setBuilderItemId(res.item.id);
        setScreen('builderDetail');
      }, [currentUser]);

      const handleSaveCustomProgram = useCallback((program) => {
        if (!currentUser) return;
        const res = AUTH.addCustomProgram(currentUser, program);
        if (res.error) return;
        setBuilderItemId(res.item.id);
        setScreen('builderDetail');
      }, [currentUser]);

      const handleCancelCreator = useCallback(() => {
        setScreen('builderMenu');
      }, []);

      // ─── Workout tracking handlers ──────────────────────────────
      const handleStartWorkout = useCallback((item) => {
        if (!item) return;
        setActiveWorkoutItem(item);
        setScreen('activeWorkout');
      }, []);

      const handleFinishWorkout = useCallback((session) => {
        if (!currentUser) {
          setActiveWorkoutItem(null);
          setScreen('builderDetail');
          return;
        }
        const res = AUTH.saveWorkoutSession(currentUser, session);
        if (res.error) return;
        setLastSession(res.session);
        setLastSessionPRs(res.newPRs || []);
        setActiveWorkoutItem(null);
        setScreen('workoutSummary');
      }, [currentUser]);

      const handleCancelWorkout = useCallback(() => {
        if (!window.confirm('End this workout without saving? Your sets will be discarded.')) return;
        setActiveWorkoutItem(null);
        setScreen('builderDetail');
      }, []);

      const handleSummaryDone = useCallback(() => {
        setLastSession(null);
        setLastSessionPRs([]);
        setScreen(builderItemId ? 'builderDetail' : 'builderMenu');
      }, [builderItemId]);

      // Resolve a builder item id from either built-in catalogs or the user's customs
      const resolveBuilderItem = (id) => {
        if (!id) return null;
        const builtin = findBuilderItem(id);
        if (builtin) return builtin;
        if (!currentUser) return null;
        const cw = AUTH.getCustomWorkouts(currentUser);
        const cp = AUTH.getCustomPrograms(currentUser);
        return cw.find((w) => w.id === id)
            || (cp.hypertrophy || []).find((p) => p.id === id)
            || (cp.powerlifting || []).find((p) => p.id === id)
            || null;
      };

      const handleReset = useCallback(() => {
        setPrimary(null);
        setSecondary(null);
        setActiveLane(null);
        setSports([]);
        setActiveSport(null);
        setBuilderItemId(null);
        setScreen('splash');
      }, []);

      const userData = currentUser ? AUTH.getUser(currentUser) : null;

      // Pre-auth / onboarding screens that should NOT show the bottom nav
      const PRE_AUTH_SCREENS = ['splash', 'welcome', 'quiz', 'results', 'login', 'signup'];
      const showBottomNav = !!currentUser && !PRE_AUTH_SCREENS.includes(screen);

      // Map a given screen to its parent tab (drives the active highlight in the nav)
      const screenToTab = (s) => {
        if (s === 'nutrition') return 'nutrition';
        if (s === 'community') return 'community';
        if (s === 'me')        return 'me';
        return 'training';
      };

      // Resolve where the Training tab should land based on the user's current state
      const resolveTrainingScreen = () => {
        if (!activeLane) return 'welcome';
        if (activeLane === 'Builder') {
          return builderItemId ? 'builderDetail' : 'builderMenu';
        }
        if (activeLane === 'Competitor') {
          if (activeSport) return 'program';
          if (sports.length > 1) return 'dailySport';
          if (sports.length === 1) { return 'program'; }
          return 'sportSelect';
        }
        return 'program';
      };

      const handleTabChange = (tab) => {
        if (tab === 'training')      setScreen(resolveTrainingScreen());
        else if (tab === 'nutrition') setScreen('nutrition');
        else if (tab === 'community') setScreen('community');
        else if (tab === 'me')        setScreen('me');
      };

      const handleAvatarTap = () => {
        setScreen('me');
      };

      return (
        <div
          className="bg-black min-h-screen relative"
          style={{
            maxWidth: '448px',
            marginLeft: 'auto',
            marginRight: 'auto',
            paddingBottom: showBottomNav ? 72 : 0,
          }}
        >
          {screen === 'splash' && (
            <SplashScreen
              onGetStarted={() => setScreen('welcome')}
              onLogin={() => { setAuthError(null); setScreen('login'); }}
            />
          )}
          {screen === 'login' && (
            <LoginScreen
              error={authError}
              onSubmit={handleLogin}
              onSwitch={() => { setAuthError(null); setScreen('signup'); }}
              onBack={() => { setAuthError(null); setScreen('splash'); }}
            />
          )}
          {screen === 'signup' && (
            <SignupScreen
              error={authError}
              onSubmit={handleSignup}
              onSwitch={() => { setAuthError(null); setScreen('login'); }}
              onBack={() => { setAuthError(null); setScreen(primary ? 'results' : 'splash'); }}
            />
          )}
          {screen === 'me' && currentUser && (
            <SettingsScreen
              email={currentUser}
              onLogout={handleLogout}
            />
          )}
          {screen === 'nutrition' && (
            <NutritionScreen />
          )}
          {screen === 'community' && (
            <CommunityScreen />
          )}
          {screen === 'welcome' && (
            <WelcomeScreen
              onStart={() => setScreen('quiz')}
              onSkip={()  => setScreen('select')}
            />
          )}
          {screen === 'quiz' && (
            <QuizScreen onComplete={handleQuizComplete} />
          )}
          {screen === 'results' && (
            <ResultsScreen
              primaryKey={primary}
              secondaryKey={secondary}
              onContinue={handleResultsContinue}
            />
          )}
          {screen === 'select' && (
            <SelectScreen onSelect={handleLaneSelect} />
          )}
          {screen === 'sportSelect' && (
            <SportSelectScreen onContinue={handleSportsContinue} />
          )}
          {screen === 'dailySport' && (
            <DailySportScreen sports={sports} onPick={handleDailySportPick} />
          )}
          {screen === 'builderMenu' && (
            <BuilderMenuScreen
              onSelect={handleBuilderSelect}
              onBack={handleReset}
              onCreateWorkout={handleCreateWorkout}
              onCreateProgram={handleCreateProgram}
              customWorkouts={currentUser ? AUTH.getCustomWorkouts(currentUser) : []}
              customPrograms={currentUser ? AUTH.getCustomPrograms(currentUser) : { hypertrophy: [], powerlifting: [] }}
            />
          )}
          {screen === 'builderDetail' && (
            <BuilderItemDetailScreen
              item={resolveBuilderItem(builderItemId)}
              onBack={handleBuilderBackToMenu}
              onReset={handleReset}
              onStart={handleStartWorkout}
            />
          )}
          {screen === 'activeWorkout' && activeWorkoutItem && (
            <ActiveWorkoutScreen
              item={activeWorkoutItem}
              prs={currentUser ? AUTH.getPRs(currentUser) : {}}
              onFinish={handleFinishWorkout}
              onCancel={handleCancelWorkout}
            />
          )}
          {screen === 'workoutSummary' && lastSession && (
            <WorkoutSummaryScreen
              session={lastSession}
              newPRs={lastSessionPRs}
              onDone={handleSummaryDone}
            />
          )}
          {screen === 'workoutCreator' && (
            <WorkoutCreatorScreen
              onSave={handleSaveCustomWorkout}
              onCancel={handleCancelCreator}
            />
          )}
          {screen === 'programCreator' && (
            <ProgramCreatorScreen
              onSave={handleSaveCustomProgram}
              onCancel={handleCancelCreator}
            />
          )}
          {screen === 'program' && (
            <ProgramScreen
              laneKey={activeLane}
              activeSport={activeSport}
              hasMultipleSports={sports.length > 1}
              onSwitchSport={handleSwitchSport}
              onReset={handleReset}
            />
          )}

          {showBottomNav && (
            <BottomNav
              activeTab={screenToTab(screen)}
              onTabChange={handleTabChange}
              activeLane={activeLane}
              activeSport={activeSport}
              user={userData}
            />
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // RENDER
    // ─────────────────────────────────────────────────────────────

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
