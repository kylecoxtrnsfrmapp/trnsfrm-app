    // ─────────────────────────────────────────────────────────────
    // SCORING LOGIC
    // ─────────────────────────────────────────────────────────────

    function calculateResults(answers) {
      const totals = { Builder: 0, Endurer: 0, Hybrid: 0, Competitor: 0 };

      answers.forEach(({ scores }) => {
        Object.entries(scores).forEach(([lane, pts]) => {
          totals[lane] += pts;
        });
      });

      const ranked = Object.entries(totals)
        .sort(([, a], [, b]) => b - a)
        .map(([lane]) => lane);

      return { primary: ranked[0], secondary: ranked[1], totals };
    }

    // ─────────────────────────────────────────────────────────────

    // ─────────────────────────────────────────────────────────────

    function QuizScreen({ onComplete }) {
      const [step, setStep]         = useState(0);
      const [answers, setAnswers]   = useState([]);
      const [selected, setSelected] = useState(null);
      const [animKey, setAnimKey]   = useState(0);

      const question    = QUESTIONS[step];
      const total       = QUESTIONS.length;
      const progressPct = ((step + 1) / total) * 100;

      const handleSelect = useCallback((answer) => {
        if (selected) return; // prevent double-tap
        setSelected(answer);

        setTimeout(() => {
          const updated = [...answers, answer];
          if (step + 1 >= total) {
            onComplete(updated);
          } else {
            setAnswers(updated);
            setStep(s => s + 1);
            setSelected(null);
            setAnimKey(k => k + 1);
          }
        }, 280);
      }, [selected, answers, step, total, onComplete]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Progress bar */}
          <div className="w-full h-px bg-white/10">
            <div
              className="h-full bg-white progress-fill"
              style={{ width: `${progressPct}%` }}
            />
          </div>

          <div key={animKey} className="screen-enter flex flex-col flex-1 px-6 pt-10 pb-10">
            {/* Counter */}
            <p
              className="text-xs text-white/25 font-medium mb-10"
              style={{ letterSpacing: '0.18em' }}
            >
              {step + 1} / {total}
            </p>

            {/* Question */}
            <h2 className="text-2xl font-bold leading-snug text-white mb-10">
              {question.text}
            </h2>

            {/* Answer cards */}
            <div className="flex flex-col gap-3 flex-1">
              {question.answers.map((answer, i) => {
                const isSelected = selected === answer;
                return (
                  <button
                    key={i}
                    onClick={() => handleSelect(answer)}
                    className={`answer-card w-full text-left px-5 py-4 border text-sm font-medium leading-snug
                      ${isSelected
                        ? 'bg-white text-black border-white selected'
                        : 'bg-transparent text-white/70 border-white/12 hover:border-white/35 hover:text-white'
                      }`}
                    style={!isSelected ? { borderColor: 'rgba(255,255,255,0.12)' } : {}}
                  >
                    {answer.text}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

              WEEKLY STRUCTURE
            </p>

            <div className="flex flex-col">
              {program.days.map((day, i) => (
                <div
                  key={i}
                  className="flex items-start gap-5 py-4"
                  style={{
                    borderBottom: i < program.days.length - 1
                      ? '1px solid rgba(255,255,255,0.07)'
                      : 'none',
                  }}
                >
                  <span className="text-xs text-white/18 font-mono pt-px w-5 shrink-0" style={{ color: 'rgba(255,255,255,0.18)' }}>
                    {day.num}
                  </span>
                  <div>
                    <p className="text-sm font-semibold text-white leading-none mb-1">
                      {day.label}
                    </p>
                    <p className="text-xs text-white/40">
                      {day.detail}
                    </p>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* CTAs */}
          <div className="pt-10 flex flex-col gap-3">
            <button
              className="w-full bg-white text-black font-semibold text-xs py-4 px-6 hover:bg-white/90 active:bg-white/80 transition-colors"
              style={{ letterSpacing: '0.18em' }}
            >
              START TODAY
            </button>
            <button
              onClick={onReset}
              className="w-full text-white/25 font-medium text-xs py-3 hover:text-white/50 transition-colors"
              style={{ letterSpacing: '0.18em' }}
            >
              START OVER
            </button>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // APP ▸ ROOT
    // ─────────────────────────────────────────────────────────────

    function App() {
      const [screen,    setScreen]    = useState('splash');
      const [primary,   setPrimary]   = useState(null);
      const [secondary, setSecondary] = useState(null);
      const [activeLane, setActiveLane] = useState(null);

      // Remove loading overlay once React is running
      useEffect(() => {
        const el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }, []);

      const handleQuizComplete = useCallback((answers) => {
        const { primary: p, secondary: s } = calculateResults(answers);
        setPrimary(p);
        setSecondary(s);
        setScreen('results');
      }, []);

      const handleResultsContinue = useCallback(() => {
        setActiveLane(primary);
        setScreen('program');
      }, [primary]);

      const handleLaneSelect = useCallback((key) => {
        setActiveLane(key);
        setScreen('program');
      }, []);

      const handleReset = useCallback(() => {
        setPrimary(null);
        setSecondary(null);
        setActiveLane(null);
        setScreen('splash');
      }, []);

      return (
        <div className="bg-black min-h-screen" style={{ maxWidth: '448px', marginLeft: 'auto', marginRight: 'auto' }}>
          {screen === 'splash' && (
            <SplashScreen onContinue={() => setScreen('welcome')} />
          )}
          {screen === 'welcome' && (
            <WelcomeScreen
              onStart={() => setScreen('quiz')}
              onSkip={()  => setScreen('select')}
            />
          )}
          {screen === 'quiz' && (
            <QuizScreen onComplete={handleQuizComplete} />
          )}
          {screen === 'results' && (
            <ResultsScreen
              primaryKey={primary}
              secondaryKey={secondary}
              onContinue={handleResultsContinue}
            />
          )}
          {screen === 'select' && (
            <SelectScreen onSelect={handleLaneSelect} />
          )}
          {screen === 'program' && (
            <ProgramScreen laneKey={activeLane} onReset={handleReset} />
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // RENDER
    // ─────────────────────────────────────────────────────────────

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
